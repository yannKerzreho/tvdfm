[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tvdfm"
version = "0.1.0"
description = "Time-Varying Dynamic Factor Model with Neural exposure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "equinox>=0.11.0",
    "diffrax>=0.5.0",
    "optax>=0.1.9",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
statsmodels = ["statsmodels>=0.14"]
dev = [
    "pytest>=7.0",
    "pytest-xdist",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tvdfm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
